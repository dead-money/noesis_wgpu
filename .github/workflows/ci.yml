name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  CARGO_TERM_COLOR: always
  # Run JS-based actions on Node 24; Node 20 is deprecated on GitHub runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The SDK jobs (all-features clippy and tests, and crates.io releases) run in
  # the private dead-money/noesis-ci repo, because the self-hosted SDK runner
  # takes no jobs from public repos. See RELEASING.md.

  # No SDK needed, so this runs on hosted runners, including for fork PRs.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  # Catches broken intra-doc links before they reach docs.rs. DOCS_RS makes
  # noesis_runtime's build script skip the native compile, so this needs no SDK.
  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo doc
        run: cargo doc --no-deps --all-features

  # Without `shim` nothing links Noesis, so the GPU tests run on hosted runners
  # through lavapipe, Mesa's software Vulkan driver.
  no-shim:
    name: build • clippy • test (no shim)
    # Pinned: lavapipe on the ubuntu-26.04 image (mesa 26.0.8) segfaults in wgpu_suite.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: cargo test
        run: cargo test --no-default-features
