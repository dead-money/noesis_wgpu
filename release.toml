# cargo-release: bumps, stamps CHANGELOG.md, commits, tags vX.Y.Z, and pushes.
# Private CI validates the tag before the public release.yml publishes it.

publish = false
tag = true
tag-name = "v{{version}}"
push = true
# release/0.N branches carry older SDK/wgpu lines; see RELEASING.md.
allow-branch = ["main", "release/*"]

pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: https://github\\.com/dead-money/noesis_wgpu/compare/v[0-9.]+\\.\\.\\.HEAD", replace = "[Unreleased]: https://github.com/dead-money/noesis_wgpu/compare/v{{version}}...HEAD\n[{{version}}]: https://github.com/dead-money/noesis_wgpu/compare/v{{prev_version}}...v{{version}}", exactly = 1 },
]
